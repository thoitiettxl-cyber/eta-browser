<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Eta Browser bounded action fixture</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 24px; max-width: 760px; }
    section { border: 1px solid #bbb; border-radius: 8px; margin: 16px 0; padding: 16px; }
    label { display: block; margin: 10px 0; }
    input, select, button { font: inherit; margin: 4px; padding: 8px; }
    #hover-menu, #account-menu { display: none; padding: 8px; background: #eef; }
    #hover-zone.revealed #hover-menu { display: block; }
    #status { min-height: 1.5em; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Eta Browser bounded action fixture</h1>
    <p id="status" role="status">ready</p>

    <section aria-labelledby="observe-heading">
      <h2 id="observe-heading">Observe and refs</h2>
      <button id="ref-target" aria-label="Replaceable target">Original target</button>
      <button id="replace-target">Replace target node</button>
      <input id="hidden-value" type="hidden" value="must-not-be-observed">
      <label>Visible field <input id="visible-field" placeholder="Visible test field"></label>
      <label>Secret field <input id="password-field" type="password" value="must-not-be-observed"></label>
      <div id="contenteditable-field" contenteditable="true">must-not-be-observed</div>
    </section>

    <section aria-labelledby="interaction-heading">
      <h2 id="interaction-heading">Interaction primitives</h2>
      <label>Status
        <select id="state-select">
          <option value="inactive">Inactive</option>
          <option value="active">Active</option>
        </select>
      </label>
      <div id="hover-zone" tabindex="0" aria-label="Hover menu trigger">
        Hover this area
        <div id="hover-menu">
          <button id="hover-action">Hover action</button>
        </div>
      </div>
      <form id="enter-form">
        <label>Enter test <input id="enter-input"></label>
        <button id="enter-submit" type="submit">Submit with Enter</button>
      </form>
    </section>

    <section aria-labelledby="handoff-heading">
      <h2 id="handoff-heading">Human handoff</h2>
      <label>Test OTP <input id="otp" inputmode="numeric" autocomplete="one-time-code"></label>
      <button id="complete-handoff">Complete handoff</button>
      <div id="account-menu">Account menu ready</div>
    </section>

    <section aria-labelledby="diagnostic-heading">
      <h2 id="diagnostic-heading">Diagnostics</h2>
      <button id="console-log">Write bounded console entry</button>
      <button id="network-failure">Request missing resource</button>
    </section>
  </main>

  <script>
    const status = document.querySelector('#status');
    const setStatus = (value) => { status.textContent = value; };

    document.querySelector('#ref-target').addEventListener('click', () => setStatus('original clicked'));
    document.querySelector('#replace-target').addEventListener('click', () => {
      const old = document.querySelector('#ref-target');
      const replacement = old.cloneNode(true);
      replacement.textContent = 'Replacement target';
      replacement.addEventListener('click', () => setStatus('replacement clicked'));
      old.replaceWith(replacement);
      setStatus('target replaced');
    });

    document.querySelector('#state-select').addEventListener('change', (event) => {
      setStatus(`selected ${event.target.value}`);
    });

    const hoverZone = document.querySelector('#hover-zone');
    hoverZone.addEventListener('mouseover', () => hoverZone.classList.add('revealed'));
    hoverZone.addEventListener('focus', () => hoverZone.classList.add('revealed'));
    document.querySelector('#hover-action').addEventListener('click', () => setStatus('hover action clicked'));

    document.querySelector('#enter-form').addEventListener('submit', (event) => {
      event.preventDefault();
      setStatus('enter submitted');
      history.pushState({}, '', '#submitted');
    });

    document.querySelector('#complete-handoff').addEventListener('click', () => {
      document.querySelector('#account-menu').style.display = 'block';
      history.pushState({}, '', '/dashboard');
      setStatus('handoff completed');
    });

    document.querySelector('#console-log').addEventListener('click', () => {
      console.warn('eta-fixture-console-warning');
      setStatus('console written');
    });

    document.querySelector('#network-failure').addEventListener('click', () => {
      const image = new Image();
      image.onload = () => setStatus('unexpected network success');
      image.onerror = () => setStatus('network failure observed');
      image.src = `/eta-browser-missing-${Date.now()}.png?secret-query-must-be-redacted=yes`;
    });

    console.info('eta-fixture-ready');
  </script>
</body>
</html>
